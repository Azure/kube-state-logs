{{- if and (eq .Values.deploymentMode "advanced") (eq (include "kube-state-logs.hasNodeResources" .) "true") }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "kube-state-logs.fullname" . }}-node
  labels:
    {{- include "kube-state-logs.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "kube-state-logs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "kube-state-logs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
      {{- if .Values.config.enableADXMonAnnotations }}
      annotations:
        {{ .Values.config.adxMonLogKeysAnnotationKey }}: "{{ include "kube-state-logs.nodeLogKeysAnnotation" . }}"
        adx-mon/scrape: "true"
        adx-mon/log-parsers: "json"
        adx-mon/log-destination: "{{ .Values.config.adxMonLogDestination }}:KubeStateLogs"
      {{- end }}
    spec:
      {{- if .Values.image.pullSecrets.name }}
      imagePullSecrets:
      - name: "{{ .Values.image.pullSecrets.name }}"
      {{- end }}
      serviceAccountName: {{ include "kube-state-logs.fullname" . }}-node
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: kube-state-logs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          image: "{{ .Values.image.registry }}/{{ .Values.image.org }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/kube-state-logs"]
          args:
            - --log-interval={{ .Values.config.logInterval }}
            - --resources={{ include "kube-state-logs.nodeResources" . }}
            {{- $nodeResourceConfigs := include "kube-state-logs.nodeResourceConfigs" . }}
            {{- if $nodeResourceConfigs }}
            - --resource-configs={{ $nodeResourceConfigs }}
            {{- end }}
            - --node=$(NODE_NAME)
            {{- if .Values.daemonset.useKubeletAPI }}
            - --use-kubelet-api
            - --node-ip=$(NODE_IP)
            - --kubelet-port={{ .Values.daemonset.kubeletPort }}
            - --kubelet-insecure-skip-verify={{ .Values.daemonset.kubeletInsecureSkipVerify }}
            {{- end }}
            {{- if .Values.config.namespaces }}
            - --namespaces={{ .Values.config.namespaces }}
            {{- end }}
            - --log-level={{ .Values.config.logLevel }}
            {{- if .Values.config.containerEnvVars }}
            - --container-envvars={{ .Values.config.containerEnvVars | join "," }}
            {{- end }}
          env:
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.daemonset.useKubeletAPI }}
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- end }}
          resources:
            limits:
              cpu: {{ .Values.daemonset.resources.limits.cpu }}
              memory: {{ .Values.daemonset.resources.limits.memory }}
            requests:
              cpu: {{ .Values.daemonset.resources.requests.cpu }}
              memory: {{ .Values.daemonset.resources.requests.memory }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - operator: Exists
      {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
